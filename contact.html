<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ENSOH Co., Ltd. — partnerships, import/export, and keys for success in Taiwan.">
  <title>ENSOH — Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="assets/images/brand/enso-logo.jpg">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/images/brand/enso-logo.jpg" alt="ENSOH ensō mark" width="40" height="40">
        <span class="brand-name">ENSOH</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html"  data-i18n="nav.home">Home</a>
        <a href="services.html"  data-i18n="nav.services">Services</a>
        <a href="partners.html"  data-i18n="nav.partners">Partners</a>
        <a href="about.html"  data-i18n="nav.about">About</a>
        <a href="contact.html" aria-current="page" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="nav-right">
        <div class="lang-switcher" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
          <button type="button" data-lang="zh-Hant" aria-pressed="false">繁中</button>
        </div>
        <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span></button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow" data-i18n="contact.eyebrow"></p>
        <h1 class="display" data-i18n="contact.title"></h1>
        <p class="lead" data-i18n="contact.lead"></p>
      </div>
    </section>
    <section class="section" style="padding-top:1rem">
      <div class="container contact-grid">
        <div>
          <div class="contact-card">
            <h3 data-i18n="contact.emailLabel"></h3>
            <a class="email" href="mailto:info@ensohcoltd.com" data-i18n="contact.email">info@ensohcoltd.com</a>
          </div>
          <div class="contact-card">
            <h3 data-i18n="contact.headOffice"></h3>
            <p data-i18n="contact.headAddr"></p>
          </div>
          <div class="contact-card">
            <h3 data-i18n="contact.branchOffice"></h3>
            <p data-i18n="contact.branchAddr"></p>
          </div>
        </div>
        <div class="contact-visual">
          <img src="assets/images/stock/contact-workspace.jpg" alt="Bright office workspace">
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">
          <img src="assets/images/brand/enso-logo.jpg" alt="" width="36" height="36">
          <strong>ENSOH</strong>
        </div>
        <p class="muted" style="color:rgba(245,243,239,.72)" data-i18n="footer.tagline"></p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.company">Company</h4>
        <a href="services.html" data-i18n="nav.services">Services</a>
        <a href="partners.html" data-i18n="nav.partners">Partners</a>
        <a href="about.html" data-i18n="nav.about">About</a>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.connect">Connect</h4>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
        <a href="mailto:info@ensohcoltd.com">info@ensohcoltd.com</a>
        <p>Taipei · Tainan</p>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© ENSOH Co., Ltd. <span data-i18n="footer.rights"></span></span>
      <span data-i18n="common.prototypeNote"></span>
    </div>
  </footer>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
