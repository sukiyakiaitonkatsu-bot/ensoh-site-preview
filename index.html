<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ENSOH Co., Ltd. — partnerships, import/export, and keys for success in Taiwan.">
  <title>ENSOH — Keys for Success</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&family=Noto+Serif+TC:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="icon" href="assets/images/brand/enso-logo.jpg">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/images/brand/enso-logo.jpg" alt="ENSOH ensō mark" width="40" height="40">
        <span class="brand-name">ENSOH</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="index.html" aria-current="page" data-i18n="nav.home">Home</a>
        <a href="services.html"  data-i18n="nav.services">Services</a>
        <a href="partners.html"  data-i18n="nav.partners">Partners</a>
        <a href="about.html"  data-i18n="nav.about">About</a>
        <a href="contact.html"  data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="nav-right">
        <div class="lang-switcher" role="group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
          <button type="button" data-lang="zh-Hant" aria-pressed="false">繁中</button>
        </div>
        <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false"><span></span></button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="hero-media">
        <img src="assets/images/stock/hero-zen.jpg" alt="Bright modern workspace with soft natural light">
      </div>
      <div class="hero-content">
        <img class="hero-logo-mark" src="assets/images/brand/enso-logo.jpg" alt="">
        <p class="eyebrow" data-i18n="home.eyebrow">ENSOH Co., Ltd.</p>
        <h1 class="display" data-i18n="home.heroTitle">We provide keys for success</h1>
        <p class="lead" data-i18n="home.heroLead"></p>
        <div class="btn-row">
          <a class="btn btn-primary" href="services.html" data-i18n="home.ctaServices">Explore services</a>
          <a class="btn btn-on-dark" href="contact.html" data-i18n="home.ctaContact">Contact us</a>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="home.missionEyebrow"></p>
          <h2 class="display" data-i18n="home.missionTitle"></h2>
        </div>
        <div class="mission-grid">
          <article class="mission-card">
            <div class="num">01</div>
            <h3 data-i18n="home.m1Title"></h3>
            <p data-i18n="home.m1Body"></p>
          </article>
          <article class="mission-card">
            <div class="num">02</div>
            <h3 data-i18n="home.m2Title"></h3>
            <p data-i18n="home.m2Body"></p>
          </article>
          <article class="mission-card">
            <div class="num">03</div>
            <h3 data-i18n="home.m3Title"></h3>
            <p data-i18n="home.m3Body"></p>
          </article>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" data-i18n="home.servicesEyebrow"></p>
          <h2 class="display" data-i18n="home.servicesTitle"></h2>
          <p class="lead" data-i18n="home.servicesLead"></p>
        </div>
        <div class="feature-band" style="margin-bottom:1.5rem">
          <div class="feature-band-media">
            <img src="assets/images/brand/fullness-products.jpg" alt="Japanese home accessory product categories">
          </div>
          <div class="feature-band-body">
            <h2 data-i18n="home.feat1Title"></h2>
            <p data-i18n="home.feat1Body"></p>
            <a class="btn btn-secondary" href="services.html" data-i18n="common.exploreServices"></a>
          </div>
        </div>
        <div class="feature-band reverse">
          <div class="feature-band-media">
            <img src="assets/images/brand/miidel7.jpg" alt="MIIDEL drawing comparison software">
          </div>
          <div class="feature-band-body">
            <h2 data-i18n="home.feat2Title"></h2>
            <p data-i18n="home.feat2Body"></p>
            <a class="btn btn-secondary" href="partners.html" data-i18n="common.viewPartners"></a>
          </div>
        </div>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="container">
        <div class="photo-cta">
          <img src="assets/images/stock/taipei-pexels.jpg" alt="Taipei cityscape">
          <div class="photo-cta-body">
            <h2 data-i18n="home.aboutTeaserTitle"></h2>
            <p data-i18n="home.aboutTeaserBody"></p>
            <a class="btn btn-primary" href="about.html" data-i18n="common.learnMore"></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">
          <img src="assets/images/brand/enso-logo.jpg" alt="" width="36" height="36">
          <strong>ENSOH</strong>
        </div>
        <p class="muted" style="color:rgba(245,243,239,.72)" data-i18n="footer.tagline"></p>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.company">Company</h4>
        <a href="services.html" data-i18n="nav.services">Services</a>
        <a href="partners.html" data-i18n="nav.partners">Partners</a>
        <a href="about.html" data-i18n="nav.about">About</a>
      </div>
      <div class="footer-col">
        <h4 data-i18n="footer.connect">Connect</h4>
        <a href="contact.html" data-i18n="nav.contact">Contact</a>
        <a href="mailto:info@ensohcoltd.com">info@ensohcoltd.com</a>
        <p>Taipei · Tainan</p>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© ENSOH Co., Ltd. <span data-i18n="footer.rights"></span></span>
      <span data-i18n="common.prototypeNote"></span>
    </div>
  </footer>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/app.js"></script>

</html>
